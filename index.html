<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>行知学堂座位管理系统</title>
<style>
body{margin:0;background:#eef2f7;font-family:"Microsoft YaHei",Arial}
h1{text-align:center;background:#2d6cdf;color:#fff;margin:0;padding:10px;font-size: 18px;}

.control-bar {
  width: 1220px;
  margin: 8px auto;
  background: #fff;
  padding: 8px 15px;
  border-radius: 6px;
  box-sizing: border-box;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.control-bar button {
  background: #28a745;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}
.control-bar button:hover { opacity: 0.9; }

/* 画布宽度恢复为 1220px，完美容纳 12 列座位 */
.room{position:relative;width:1220px;height:780px;margin:8px auto;background:#fff;border:2px solid #333;border-radius:8px;box-sizing: border-box;}
.seat,.area{position:absolute;border:2px solid #333;border-radius:6px;display:flex;align-items:center;justify-content:center}

.seat{width:95px;height:95px;background:#fafafa;flex-direction:column;font-size:14px;font-weight:bold;line-height:1.3;overflow:hidden;box-sizing: border-box;padding: 4px;}
.seat span {
  display: block;
  width: 100%;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.area{background:#f3f3f3;font-weight:bold;box-sizing: border-box;font-size: 15px;}

/* A4 打印与 PDF 导出适配 */
@media print {
  @page { 
    size: A4 landscape; 
    margin: 5mm; 
  }
  body { background: #fff; margin: 0; }
  h1, .control-bar { display: none !important; }
  .room { 
    margin: 0 auto; 
    border: 2px solid #333 !important; 
    width: 1220px !important; 
    height: 770px !important; 
    page-break-inside: avoid;
  }
}
</style>
</head>
<body>
<h1>行知学堂座位管理系统</h1>

<div class="control-bar">
  <div>
    <span id="tip-msg" style="font-size: 13px; color: #555;">正在加载数据...</span>
  </div>
  <div>
    <button onclick="window.print()">🖨️ 打印到 A4 纸 / 存为 PDF</button>
  </div>
</div>

<div class="room">
<!-- 柜子宽度 193px -->
<div class="area" style="left:20px;top:250px;width:193px;height:193px;">柜子</div>
<!-- 答疑和书架宽度 193px -->
<div class="area" style="left:20px;top:620px;width:193px;height:95px;">答疑</div>
<div class="area" style="left:223px;top:620px;width:193px;height:95px;">书架</div>
<div id="seats"></div>
</div>

<script>
const pos=[];
const colLeft = (colIndex) => 20 + colIndex * 98;

// 1. 第一排：12个座位 (列 0 ~ 11) -> y = 20
for(let i=0; i<12; i++) pos.push([colLeft(i), 20]);

// 2. 中间第一组：4个座位 (列 7 到 10) -> y = 250
for(let i=0; i<4; i++) pos.push([colLeft(7 + i), 250]);

// 3. 中间第二组：4个座位 (列 7 到 10) -> y = 348 (紧贴上一行)
for(let i=0; i<4; i++) pos.push([colLeft(7 + i), 348]);

// 4. 底部一行：5个座位 (列 7 到 11) -> y = 620
for(let i=0; i<5; i++) pos.push([colLeft(7 + i), 620]);

let data = [];
const seats = document.getElementById("seats");

function loadData() {
  fetch('data.json')
    .then(res => res.json())
    .then(json => {
      data = json;
      render();
      document.getElementById("tip-msg").innerText = "状态：已成功从 data.json 加载座位数据。";
      document.getElementById("tip-msg").style.color = "green";
    })
    .catch(err => {
      console.error(err);
      document.getElementById("tip-msg").innerText = "提示：无法读取 data.json（请确保通过本地服务器环境打开）。";
      document.getElementById("tip-msg").style.color = "red";
    });
}

function render(){
  seats.innerHTML = "";
  data.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "seat";
    if(pos[i]) {
      d.style.left = pos[i][0] + "px";
      d.style.top = pos[i][1] + "px";
    }
    let html = `<span>${s.name1 || "空座位"}</span>`;
    if(s.name2) html += `<span>${s.name2}</span>`;
    if(s.name3) html += `<span>${s.name3}</span>`;
    d.innerHTML = html;
    seats.appendChild(d);
  });
}

loadData();
</script>
</body>
</html>
